name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --all-packages

      - name: Run the test suite
        run: uv run pytest

      # Keeps the README badge honest: adding a test without regenerating the
      # badge turns the build red instead of silently publishing a stale count.
      - name: Check the test-count badge is current
        run: uv run python scripts/test_badge.py --check
