# Virtual workspace root: no package of its own, just the member glob.
[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode lets every package keep its own tests/test_provider.py without
# the files colliding on one module name -- the default "prepend" mode maps
# same-named test files across packages to a single import and fails collection.
addopts = "-q --import-mode=importlib"
