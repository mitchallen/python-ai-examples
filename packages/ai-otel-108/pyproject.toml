[project]
name = "ai-otel-108"
version = "0.1.0"
description = "Retries and rate limits with telemetry: one span per attempt, and quota headers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai-otel-101",
    "ai-python-101",
    "httpx>=0.27",
    "openai>=1.40",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
ai-otel-108 = "ai_otel_108.__main__:main"

[tool.uv.sources]
ai-otel-101 = { workspace = true }
ai-python-101 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_otel_108"]
