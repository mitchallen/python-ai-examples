[project]
name = "ai-otel-106"
version = "0.1.0"
description = "Structured outputs with telemetry: schema validation as a first-class outcome."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai-otel-101",
    "ai-python-101",
    "openai>=1.40",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
ai-otel-106 = "ai_otel_106.__main__:main"

[tool.uv.sources]
ai-otel-101 = { workspace = true }
ai-python-101 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_otel_106"]
