[project]
name = "ai-otel-107"
version = "0.1.0"
description = "Embeddings with telemetry: batches, cache hits, and the tokens that do not exist."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai-otel-101",
    "ai-python-101",
    "openai>=1.40",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
ai-otel-107 = "ai_otel_107.__main__:main"

[tool.uv.sources]
ai-otel-101 = { workspace = true }
ai-python-101 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_otel_107"]
