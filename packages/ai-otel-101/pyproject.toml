[project]
name = "ai-otel-101"
version = "0.1.0"
description = "Wrap an OpenAI call in OpenTelemetry: gen_ai spans, token-usage and latency metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ai-python-101",
    "openai>=1.40",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
ai-otel-101 = "ai_otel_101.__main__:main"

[tool.uv.sources]
ai-python-101 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_otel_101"]
